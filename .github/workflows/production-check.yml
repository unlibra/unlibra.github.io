# Checks the live site every day: on each host of SITES, the files at the root
# (FILES), and every page in /sitemap.xml (a sitemap, or an index of sitemaps)
# answer 200. On docs.unlibra.com, the index lists the sitemaps of the projects, so a broken
# deploy of any project shows up too. A failed run is mailed by GitHub to the
# user who last changed the schedule. The same file in docs.unlibra.com and
# yorucha.link but for SITES and FILES.
#
# Every request names itself (UA): yorucha.link's Cloudflare answers curl's own
# User-Agent with a challenge (403, cf-mitigated: challenge).
#
# GitHub turns off scheduled workflows of a public repository after 60 days
# without activity; it mails a warning first.
name: Production check

on:
  schedule:
    # 21:37 UTC = 06:37 JST, off the hour, when scheduled runs pile up.
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UA: unlibra-production-check
  SITES: https://docs.unlibra.com
  FILES: / /robots.txt /sitemap.xml /llms.txt /third-party-licenses.txt /favicon.ico /favicon.svg /apple-touch-icon.png /brand/symbol.svg

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every page answers 200
        run: |
          set -euo pipefail
          failed=0
          check() {
            code=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' --max-time 30 "$1" || true)
            if [ "$code" = 200 ]; then
              echo "OK   $1"
            else
              echo "FAIL $code $1"
              failed=1
            fi
          }
          locs() { curl -sf -A "$UA" --max-time 30 "$1" | grep -o '<loc>[^<]*' | cut -c6-; }

          for SITE in $SITES; do
          for path in $FILES; do
            check "$SITE$path"
          done

          sitemap=$(curl -sf -A "$UA" --max-time 30 "$SITE/sitemap.xml")
          if grep -q '<sitemapindex' <<<"$sitemap"; then
            sitemaps=$(grep -o '<loc>[^<]*' <<<"$sitemap" | cut -c6-)
          else
            sitemaps="$SITE/sitemap.xml"
          fi
          [ -n "$sitemaps" ] || { echo "FAIL no sitemaps in $SITE/sitemap.xml"; exit 1; }
          for sitemap in $sitemaps; do
            pages=$(locs "$sitemap" || true)
            if [ -z "$pages" ]; then
              echo "FAIL no pages in $sitemap"
              failed=1
            fi
            for page in $pages; do
              check "$page"
            done
          done
          done
          exit "$failed"
